name: CI

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxdo-dev libxkbcommon-dev cmake
      - run: cargo clippy -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # dbus provides the private dbus-daemon tests/media_pause.rs runs.
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxdo-dev libxkbcommon-dev cmake dbus
      - run: cargo test
