name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and release
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  linux:
    name: Linux ${{ matrix.variant }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            feature: ""
            package_variant: ""
            suffix: ""
          - variant: gpu-vulkan
            feature: gpu-vulkan
            package_variant: gpu-vulkan
            suffix: -gpu-vulkan
          - variant: gpu-cuda
            feature: gpu-cuda
            package_variant: gpu-cuda
            suffix: -gpu-cuda
          - variant: gpu-rocm
            feature: gpu-rocm
            package_variant: gpu-rocm
            suffix: -gpu-rocm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libasound2-dev libclang-dev libssl-dev libwayland-dev libxdo-dev pkg-config
      - name: Install Vulkan build dependencies
        if: matrix.feature == 'gpu-vulkan'
        run: sudo apt-get install -y glslc libvulkan-dev
      - name: Install CUDA toolkit
        if: matrix.feature == 'gpu-cuda'
        uses: Jimver/cuda-toolkit@v0.2.27
        with:
          cuda: 12.6.3
      - name: Configure CUDA linker paths
        if: matrix.feature == 'gpu-cuda'
        run: |
          cuda_root="${CUDA_PATH:-/usr/local/cuda}"
          if [ ! -e "$cuda_root/lib" ]; then
            sudo ln -s "$cuda_root/lib64" "$cuda_root/lib"
          fi
          sudo mkdir -p /run/opengl-driver/lib
          sudo ln -sfn "$cuda_root/targets/x86_64-linux/lib/stubs/libcuda.so" /run/opengl-driver/lib/libcuda.so
          echo "CUDAToolkit_ROOT=$cuda_root" >> "$GITHUB_ENV"
      - name: Install ROCm development toolchain
        if: matrix.feature == 'gpu-rocm'
        run: |
          wget -q https://repo.radeon.com/amdgpu-install/6.4/ubuntu/jammy/amdgpu-install_6.4.60400-1_all.deb
          sudo apt-get install -y ./amdgpu-install_6.4.60400-1_all.deb
          sudo apt-get update
          sudo apt-get install -y rocm-dev rocm-llvm-dev
          echo "/opt/rocm/bin" >> "$GITHUB_PATH"
          echo "ROCM_PATH=/opt/rocm" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/opt/rocm/lib:${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Build release binary
        env:
          TRANSCRIBE_CMAKE_ARGS: ${{ matrix.feature == 'gpu-rocm' && '-DAMDGPU_TARGETS=gfx803;gfx900;gfx906;gfx908;gfx90a;gfx942;gfx1030;gfx1100;gfx1101;gfx1102;gfx1201' || '' }}
        run: |
          if [ -n "${{ matrix.feature }}" ]; then
            cargo build --locked --release --features "${{ matrix.feature }}"
          else
            cargo build --locked --release
          fi
      - name: Package Debian archive and binary
        env:
          PACKAGE_VARIANT: ${{ matrix.package_variant }}
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p release-assets
          if [ -n "$PACKAGE_VARIANT" ]; then
            cargo deb --locked --no-build --variant "$PACKAGE_VARIANT" --deb-version "$version"
          else
            cargo deb --locked --no-build --deb-version "$version"
          fi
          cp target/debian/*.deb release-assets/
          cp target/release/tonguetyped "release-assets/tonguetyped-${RELEASE_TAG}-linux-x86_64${{ matrix.suffix }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.variant }}
          path: release-assets/
          if-no-files-found: error

  macos-metal:
    name: macOS gpu-metal (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            # Apple Silicon, native.
            runner: macos-14
          - arch: x86_64
            # Native Intel build, preferred over cross-compiling from
            # macos-14 since transcribe-cpp's cmake build is more likely to
            # work correctly built natively per-arch. macos-13 (the prior
            # Intel default) was retired 2025-12-04; macos-15-intel is
            # GitHub's current native x86_64 macOS runner label.
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Metal release binary
        run: cargo build --locked --release --features gpu-metal
      - name: Archive Metal binary
        run: |
          mkdir -p release-assets
          tar -C target/release -czf "release-assets/tonguetyped-${RELEASE_TAG}-macos-${{ matrix.arch }}-gpu-metal.tar.gz" tonguetyped
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-gpu-metal-${{ matrix.arch }}
          path: release-assets/
          if-no-files-found: error

  arch:
    name: Arch package
    needs: [linux]
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install build dependencies
        run: pacman -Sy --noconfirm --needed base-devel git
      - name: Create unprivileged build user
        # makepkg refuses to run as root.
        run: useradd -m builder
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: release-linux-default
          path: linux-release
      - name: Resolve PKGBUILD for this release
        run: |
          version="${RELEASE_TAG#v}"
          binary="linux-release/tonguetyped-${RELEASE_TAG}-linux-x86_64"
          test -f "$binary"
          mkdir -p build
          cp PKGBUILD build/PKGBUILD
          sha256="$(sha256sum "$binary" | cut -d' ' -f1)"
          sed -i "s/^pkgver=.*/pkgver=${version}/" build/PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('${sha256}')/" build/PKGBUILD
          # Place the already-built binary under the name makepkg's source
          # array expects, so makepkg verifies the checksum locally instead
          # of downloading from the GitHub release - which doesn't exist yet
          # at this point in the workflow.
          cp "$binary" "build/tonguetyped-v${version}-linux-x86_64"
          chown -R builder:builder build
      - name: Build package with makepkg
        run: su builder -c 'cd build && makepkg --noconfirm --nodeps'
      - name: Generate .SRCINFO
        run: su builder -c 'cd build && makepkg --printsrcinfo > .SRCINFO'
      - name: Collect release asset
        run: |
          mkdir -p release-assets
          cp build/*.pkg.tar.zst release-assets/
      - uses: actions/upload-artifact@v4
        with:
          name: release-arch
          path: release-assets/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: aur-pkgbuild
          path: |
            build/PKGBUILD
            build/.SRCINFO
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [linux, macos-metal, arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --generate-notes --title "$RELEASE_TAG"
          fi

  aur-publish:
    name: Publish to AUR
    # Runs after the GitHub release exists so the PKGBUILD's source URL
    # (a GitHub release download link) actually resolves for AUR users.
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - name: Check for AUR SSH key
        id: check
        env:
          HAS_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$HAS_KEY" ]; then
            echo "::notice::AUR_SSH_PRIVATE_KEY secret is not set - skipping AUR publish. Add that secret (a deploy SSH key for an AUR account) to publish tonguetyped-bin to the AUR automatically."
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          else
            echo "AUR_SSH_PRIVATE_KEY secret found - publishing tonguetyped-bin to the AUR."
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.check.outputs.has_key == 'true'
        with:
          name: aur-pkgbuild
          path: aur-pkg
      - name: Set up SSH agent for AUR
        if: steps.check.outputs.has_key == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" | ssh-add -
      - name: Push package to AUR
        if: steps.check.outputs.has_key == 'true'
        env:
          GIT_AUTHOR_NAME: cheerfulScumbag
          GIT_AUTHOR_EMAIL: 164391367+cheerfulScumbag@users.noreply.github.com
          GIT_COMMITTER_NAME: cheerfulScumbag
          GIT_COMMITTER_EMAIL: 164391367+cheerfulScumbag@users.noreply.github.com
        run: |
          git clone ssh://aur@aur.archlinux.org/tonguetyped-bin.git aur-repo
          cp aur-pkg/PKGBUILD aur-pkg/.SRCINFO aur-repo/
          cd aur-repo
          if [ -z "$(git status --porcelain -- PKGBUILD .SRCINFO)" ]; then
            echo "AUR package already up to date for ${RELEASE_TAG}; nothing to push."
            exit 0
          fi
          git add PKGBUILD .SRCINFO
          git commit -m "Update to ${RELEASE_TAG}"
          git push origin master
