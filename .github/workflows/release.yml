name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and release
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  # libsamplerate-sys still declares cmake_minimum_required(VERSION 2.8).
  # CMake 4 removed compatibility with minimums below 3.5.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  linux:
    name: Linux ${{ matrix.variant }}
    # ort/onnxruntime's prebuilt static library needs glibc 2.38 or newer.
    # Ubuntu 24.04 also provides glslc for the Vulkan backend.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: gpu-vulkan
            feature: gpu-vulkan
          - variant: gpu-cuda
            feature: gpu-cuda
          - variant: gpu-rocm
            feature: gpu-rocm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libasound2-dev libclang-dev libssl-dev libwayland-dev libxdo-dev libxkbcommon-dev pkg-config
      - name: Install Vulkan build dependencies
        if: matrix.feature == 'gpu-vulkan'
        run: sudo apt-get install -y glslc libvulkan-dev spirv-headers
      - name: Install CUDA toolkit
        if: matrix.feature == 'gpu-cuda'
        uses: Jimver/cuda-toolkit@v0.2.27
        with:
          cuda: 12.6.3
      - name: Configure CUDA linker paths
        if: matrix.feature == 'gpu-cuda'
        run: |
          cuda_root="${CUDA_PATH:-/usr/local/cuda}"
          if [ ! -e "$cuda_root/lib" ]; then
            sudo ln -s "$cuda_root/lib64" "$cuda_root/lib"
          fi
          sudo mkdir -p /run/opengl-driver/lib
          sudo ln -sfn "$cuda_root/targets/x86_64-linux/lib/stubs/libcuda.so" /run/opengl-driver/lib/libcuda.so
          echo "CUDAToolkit_ROOT=$cuda_root" >> "$GITHUB_ENV"
      - name: Install ROCm development toolchain
        if: matrix.feature == 'gpu-rocm'
        run: |
          wget -q https://repo.radeon.com/amdgpu-install/6.4/ubuntu/noble/amdgpu-install_6.4.60400-1_all.deb
          sudo apt-get install -y ./amdgpu-install_6.4.60400-1_all.deb
          sudo apt-get update
          sudo apt-get install -y rocm-dev rocm-llvm-dev hipblas-dev rocblas-dev
          echo "/opt/rocm/bin" >> "$GITHUB_PATH"
          echo "ROCM_PATH=/opt/rocm" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/opt/rocm/lib:${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm --locked
      - name: Build release binary
        env:
          TRANSCRIBE_CMAKE_ARGS: ${{ matrix.feature == 'gpu-rocm' && '-DAMDGPU_TARGETS=gfx803;gfx900;gfx906;gfx908;gfx90a;gfx942;gfx1030;gfx1100;gfx1101;gfx1102;gfx1201' || '' }}
        run: cargo build --locked --release --features "${{ matrix.feature }}"
      - name: Package Debian archive, RPM, and binary
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p release-assets
          cargo deb --locked --no-build --variant "${{ matrix.variant }}" --deb-version "$version"
          cp target/debian/*.deb release-assets/
          cargo generate-rpm --variant "${{ matrix.variant }}" \
            --set-metadata "version = \"${version}\"" \
            -o "release-assets/tonguetyped-${RELEASE_TAG}-linux-x86_64-${{ matrix.variant }}.rpm"
          cp target/release/tonguetyped "release-assets/tonguetyped-${RELEASE_TAG}-linux-x86_64-${{ matrix.variant }}"
      - name: Check out release bundling helper
        # The checked-out tag can predate the bundling helper, so take it from
        # the revision this workflow file came from. An existing tag rerun then
        # still has the helper available.
        if: matrix.variant == 'gpu-vulkan'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: workflow-src
      - name: Bundle shell completions, man pages, and app icon
        # build.rs writes the completions and man pages to target/release/dist
        # during the release build; the same files are already inside the .deb
        # and .rpm above. The app icon is copied by the helper when the source
        # tree carries it. One bundle is enough - it is identical for every
        # backend.
        if: matrix.variant == 'gpu-vulkan'
        run: bash workflow-src/scripts/bundle-release.sh "$RELEASE_TAG" target/release/dist release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.variant }}
          path: release-assets/
          if-no-files-found: error

  linux-aarch64:
    name: Linux aarch64 (cpu)
    # Native arm64 runner: no cross toolchain to maintain. CPU-only - the
    # CUDA and ROCm backends are x86_64-only, and there is no mainstream
    # arm64 Vulkan target worth shipping yet. ort/onnxruntime's prebuilt
    # aarch64-unknown-linux-gnu library is CPU-only and needs glibc 2.38+,
    # which Ubuntu 24.04 provides.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libasound2-dev libclang-dev libssl-dev libwayland-dev libxdo-dev libxkbcommon-dev pkg-config
      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm --locked
      - name: Build release binary
        run: cargo build --locked --release
      - name: Package Debian archive, RPM, and binary
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p release-assets
          cargo deb --locked --no-build --deb-version "$version"
          cp target/debian/*.deb release-assets/
          cargo generate-rpm \
            --set-metadata "version = \"${version}\"" \
            -o "release-assets/tonguetyped-${RELEASE_TAG}-linux-aarch64-cpu.rpm"
          cp target/release/tonguetyped "release-assets/tonguetyped-${RELEASE_TAG}-linux-aarch64-cpu"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-aarch64
          path: release-assets/
          if-no-files-found: error

  arch:
    name: Arch package
    needs: [linux]
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install build dependencies
        run: pacman -Sy --noconfirm --needed base-devel git
      - name: Create unprivileged build user
        # makepkg refuses to run as root.
        run: useradd -m builder
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: release-linux-gpu-vulkan
          path: linux-release
      - name: Resolve PKGBUILD for this release
        run: |
          version="${RELEASE_TAG#v}"
          binary="linux-release/tonguetyped-${RELEASE_TAG}-linux-x86_64-gpu-vulkan"
          bundle="linux-release/tonguetyped-${RELEASE_TAG}-completions-and-man.tar.gz"
          test -f "$binary"
          test -f "$bundle"
          mkdir -p build
          cp PKGBUILD build/PKGBUILD
          sha256_binary="$(sha256sum "$binary" | cut -d' ' -f1)"
          sha256_bundle="$(sha256sum "$bundle" | cut -d' ' -f1)"
          sed -i "s/^pkgver=.*/pkgver=${version}/" build/PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('${sha256_binary}' '${sha256_bundle}')/" build/PKGBUILD
          # Place the already-built assets under the names makepkg's source
          # array expects, so makepkg verifies their checksums locally instead
          # of downloading from the GitHub release - which doesn't exist yet
          # at this point in the workflow.
          cp "$binary" "build/tonguetyped-v${version}-linux-x86_64-gpu-vulkan"
          cp "$bundle" "build/tonguetyped-v${version}-completions-and-man.tar.gz"
          chown -R builder:builder build
      - name: Build package with makepkg
        run: su builder -c 'cd build && makepkg --noconfirm --nodeps'
      - name: Generate .SRCINFO
        run: su builder -c 'cd build && makepkg --printsrcinfo > .SRCINFO'
      - name: Collect release asset
        run: |
          mkdir -p release-assets
          cp build/*.pkg.tar.zst release-assets/
      - uses: actions/upload-artifact@v4
        with:
          name: release-arch
          path: release-assets/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: aur-pkgbuild
          path: |
            build/PKGBUILD
            build/.SRCINFO
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [linux, linux-aarch64, arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        # One checksum per release artifact (not per signature, not for the
        # manifest itself). Deterministic order: the shell glob sorts.
        run: |
          cd release-assets
          shopt -s nullglob
          files=(*)
          targets=()
          for file in "${files[@]}"; do
            case "$file" in
              *.asc|SHA256SUMS.txt) continue ;;
            esac
            targets+=("$file")
          done
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "no artifacts to checksum; failing." >&2
            exit 1
          fi
          sha256sum "${targets[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Sign release artifacts
        # Detached, ASCII-armored signatures (.asc) over every artifact and
        # SHA256SUMS.txt itself. Signing is skipped with a loud warning when
        # the GPG secrets are absent, so a release still publishes without
        # signatures rather than blocking on a missing secret. Set
        # GPG_PRIVATE_KEY (armored secret key) and GPG_PASSPHRASE to enable
        # it; GPG_SIGNING_KEY (fingerprint) is optional and pins which key
        # signs when the import holds more than one.
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          if [ -z "${GPG_PRIVATE_KEY:-}" ] || [ -z "${GPG_PASSPHRASE:-}" ]; then
            echo "::warning::GPG_PRIVATE_KEY / GPG_PASSPHRASE not set - publishing without detached signatures. Add both repository secrets to sign SHA256SUMS.txt and every artifact."
            exit 0
          fi
          WORK="$(mktemp -d)"
          trap 'rm -rf "${WORK}"' EXIT
          export GNUPGHOME="${WORK}/gpg"
          mkdir -p "${GNUPGHOME}"
          chmod 700 "${GNUPGHOME}"
          printf 'allow-loopback-pinentry\n' > "${GNUPGHOME}/gpg-agent.conf"
          printf 'pinentry-mode loopback\n' > "${GNUPGHOME}/gpg.conf"
          gpgconf --kill gpg-agent || true
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --import
          local_user_args=()
          if [ -n "${GPG_SIGNING_KEY:-}" ]; then
            local_user_args=(--local-user "${GPG_SIGNING_KEY}!")
          fi
          cd release-assets
          shopt -s nullglob
          files=(*)
          for file in "${files[@]}"; do
            case "$file" in
              *.asc) continue ;;
            esac
            printf '%s' "${GPG_PASSPHRASE}" | gpg --batch --yes \
              --pinentry-mode loopback --passphrase-fd 0 \
              "${local_user_args[@]}" \
              --detach-sign --armor --output "${file}.asc" "${file}"
            echo "signed ${file}"
          done
          echo "Detached signatures:"
          ls -1 ./*.asc
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --generate-notes --title "$RELEASE_TAG"
          fi

  aur-publish:
    name: Publish to AUR
    # Runs after the GitHub release exists so the PKGBUILD's source URLs
    # (GitHub release download links) actually resolve for AUR users.
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - name: Check for AUR SSH key
        id: check
        env:
          HAS_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$HAS_KEY" ]; then
            echo "::notice::AUR_SSH_PRIVATE_KEY secret is not set - skipping AUR publish. Add that secret (a deploy SSH key for an AUR account) to publish tonguetyped-bin to the AUR automatically."
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          else
            echo "AUR_SSH_PRIVATE_KEY secret found - publishing tonguetyped-bin to the AUR."
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.check.outputs.has_key == 'true'
        with:
          name: aur-pkgbuild
          path: aur-pkg
      - name: Set up SSH agent for AUR
        if: steps.check.outputs.has_key == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" | ssh-add -
      - name: Push package to AUR
        if: steps.check.outputs.has_key == 'true'
        env:
          GIT_AUTHOR_NAME: cheerfulScumbag
          GIT_AUTHOR_EMAIL: 164391367+cheerfulScumbag@users.noreply.github.com
          GIT_COMMITTER_NAME: cheerfulScumbag
          GIT_COMMITTER_EMAIL: 164391367+cheerfulScumbag@users.noreply.github.com
        run: |
          git clone ssh://aur@aur.archlinux.org/tonguetyped-bin.git aur-repo
          cp aur-pkg/PKGBUILD aur-pkg/.SRCINFO aur-repo/
          cd aur-repo
          if [ -z "$(git status --porcelain -- PKGBUILD .SRCINFO)" ]; then
            echo "AUR package already up to date for ${RELEASE_TAG}; nothing to push."
            exit 0
          fi
          git add PKGBUILD .SRCINFO
          git commit -m "Update to ${RELEASE_TAG}"
          git push origin master
