[package]
name = "tonguetyped"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tonguetyped"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
sha2 = "0.10"
cpal = "0.18.2"
alsa = "0.11"
rubato = "0.15"
transcribe-rs = { version = "=0.3.11", features = ["whisper-cpp"] }
transcribe-cpp = { version = "=0.2.4", optional = true, default-features = false }
vad-rs = { git = "https://github.com/cjpais/vad-rs", rev = "2a412ed858695b9251f3f5a1a20d95b59fa7c498" }
rusqlite = { version = "0.32", features = ["bundled"] }
indicatif = "0.17"
num_cpus = "1"
reqwest = { version = "0.12", features = ["stream"] }
directories = "5"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
enigo = "0.3"
ashpd = { version = "0.12", default-features = false, features = ["tokio"] }
ratatui = "0.30.2"
crossterm = "0.29.0"
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop"] }

[features]
# GPU inference backends, built on the transcribe.cpp Rust binding. Neither is
# enabled by default: the default build keeps the tested transcribe-rs/whisper.cpp
# CPU path exactly as-is. When a GPU feature is compiled in, InferenceEngine
# tries that backend first and falls back to the CPU path if the model is
# missing or loading/inference fails. If both are enabled, cuda takes priority
# (see src/inference.rs).
gpu-vulkan = ["dep:transcribe-cpp", "transcribe-cpp/vulkan"]
gpu-cuda = ["dep:transcribe-cpp", "transcribe-cpp/cuda"]
