[package]
name = "tonguetyped"
version = "0.2.2"
edition = "2021"
description = "Local Linux dictation controlled from the terminal or a desktop-wide keyboard shortcut"
repository = "https://github.com/cheerfulScumbag/tonguetyped"
license = "MIT"

[package.metadata.deb]
maintainer = "cheerfulScumbag <164391367+cheerfulScumbag@users.noreply.github.com>"
extended-description = """\
Privacy-focused offline dictation for Linux. Speech is transcribed on this
machine with transcribe.cpp and typed into the focused application or written
to text files. No account, no cloud, and no audio leaves the computer."""
depends = "$auto"
# wtype types through the Wayland virtual-keyboard protocol (wlroots
# compositors only) and wl-clipboard provides `wl-copy`, which the clipboard
# and paste output methods and the typing fallback copy with.
# Recommends rather than Depends because the deb targets releases as old as
# Debian bullseye, which has no wtype package. dotool - the /dev/uinput
# Wayland helper - is deliberately not listed here: Debian has no dotool
# package (only the unrelated ydotool), so recommending it could never
# resolve. The Arch and Nix packages do ship dotool.
recommends = "wtype, wl-clipboard"
# xclip is the clipboard helper on X11 sessions, for the clipboard and paste
# output methods and the typing fallback.
suggests = "xclip"
section = "utils"
priority = "optional"
# `$auto` keeps the binary in /usr/bin and the readme under /usr/share/doc;
# the rest are the shell completions and man pages build.rs writes into
# `target/<profile>/dist/` (the directory cargo-deb remaps `target/release/`
# to). Every variant inherits this list.
assets = [
    "$auto",
    ["target/release/dist/completions/tonguetyped.bash", "usr/share/bash-completion/completions/tonguetyped", "644"],
    ["target/release/dist/completions/_tonguetyped", "usr/share/zsh/site-functions/_tonguetyped", "644"],
    ["target/release/dist/completions/tonguetyped.fish", "usr/share/fish/vendor_completions.d/tonguetyped.fish", "644"],
    ["target/release/dist/man/*.1", "usr/share/man/man1/", "644"],
]

# One .deb per GPU backend (each also carries the CPU fallback). They all
# install /usr/bin/tonguetyped, so each provides, conflicts with and replaces
# the virtual `tonguetyped` package (the pre-0.2.2 bundled package's name):
# installing one backend swaps out whichever was there before.
[package.metadata.deb.variants.gpu-vulkan]
name = "tonguetyped-gpu-vulkan"
provides = "tonguetyped"
conflicts = "tonguetyped"
replaces = "tonguetyped"

[package.metadata.deb.variants.gpu-cuda]
name = "tonguetyped-gpu-cuda"
provides = "tonguetyped"
conflicts = "tonguetyped"
replaces = "tonguetyped"

[package.metadata.deb.variants.gpu-rocm]
name = "tonguetyped-gpu-rocm"
provides = "tonguetyped"
conflicts = "tonguetyped"
replaces = "tonguetyped"

# RPM packaging (cargo-generate-rpm), the Fedora/RHEL family counterpart to
# the .deb variants above. Same layout: one package per GPU backend, all
# providing/conflicting/obsoleting the virtual `tonguetyped` name so
# installing a different backend swaps it out. Assets mirror the .deb list.
# cargo-generate-rpm reads dependencies as tables mapping a package name to a
# version requirement ("" means any version), not as lists.
[package.metadata.generate-rpm]
assets = [
    { source = "target/release/tonguetyped", dest = "/usr/bin/tonguetyped", mode = "755" },
    { source = "target/release/dist/completions/tonguetyped.bash", dest = "/usr/share/bash-completion/completions/tonguetyped", mode = "644" },
    { source = "target/release/dist/completions/_tonguetyped", dest = "/usr/share/zsh/site-functions/_tonguetyped", mode = "644" },
    { source = "target/release/dist/completions/tonguetyped.fish", dest = "/usr/share/fish/vendor_completions.d/tonguetyped.fish", mode = "644" },
    { source = "target/release/dist/man/*.1", dest = "/usr/share/man/man1/", mode = "644" },
]

[package.metadata.generate-rpm.recommends]
wtype = ""
wl-clipboard = ""

[package.metadata.generate-rpm.variants.gpu-vulkan]
name = "tonguetyped-gpu-vulkan"

[package.metadata.generate-rpm.variants.gpu-vulkan.provides]
tonguetyped = ""

[package.metadata.generate-rpm.variants.gpu-vulkan.conflicts]
tonguetyped = ""

[package.metadata.generate-rpm.variants.gpu-vulkan.obsoletes]
tonguetyped = ""

[package.metadata.generate-rpm.variants.gpu-cuda]
name = "tonguetyped-gpu-cuda"

[package.metadata.generate-rpm.variants.gpu-cuda.provides]
tonguetyped = ""

[package.metadata.generate-rpm.variants.gpu-cuda.conflicts]
tonguetyped = ""

[package.metadata.generate-rpm.variants.gpu-cuda.obsoletes]
tonguetyped = ""

[package.metadata.generate-rpm.variants.gpu-rocm]
name = "tonguetyped-gpu-rocm"

[package.metadata.generate-rpm.variants.gpu-rocm.provides]
tonguetyped = ""

[package.metadata.generate-rpm.variants.gpu-rocm.conflicts]
tonguetyped = ""

[package.metadata.generate-rpm.variants.gpu-rocm.obsoletes]
tonguetyped = ""

[[bin]]
name = "tonguetyped"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
sha2 = "0.10"
cpal = "0.18.2"
alsa = "0.11"
rubato = "0.15"
transcribe-cpp = { version = "=0.2.4", default-features = false }
vad-rs = { git = "https://github.com/cjpais/vad-rs", rev = "2a412ed858695b9251f3f5a1a20d95b59fa7c498" }
rusqlite = { version = "0.32", features = ["bundled"] }
indicatif = "0.17"
num_cpus = "1"
# Reads WAV input for `tonguetyped transcribe <file>` (src/transcribe.rs); the
# live capture path uses cpal/rubato and never touches WAV files.
hound = "3"
reqwest = { version = "0.12", features = ["stream"] }
directories = "5"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
libc = "0.2"
enigo = "0.3"
ashpd = { version = "0.12", default-features = false, features = ["tokio"] }
# The native libei typing backend (src/libei.rs): the EI/EIS protocol over the
# XDG RemoteDesktop portal's `ConnectToEIS` file descriptor. `reis` is pure
# Rust (no C library). `xkbcommon` compiles the compositor's keymap and maps
# characters to keycodes; it links the system libxkbcommon, which the flake,
# CI, and PKGBUILD now build against alongside the other GUI libraries.
reis = "0.5"
xkbcommon = "0.8"
# Session-bus client for pausing MPRIS media players while recording
# (`src/media.rs`). Same major version and tokio executor ashpd already pulls in.
zbus = { version = "5", default-features = false, features = ["tokio"] }
# `unstable-rendered-line-info` exposes `Paragraph::line_count`, which the
# dashboard's Info/result pane needs to clamp its scroll offset to the wrapped
# content height (a long single-line transcript wraps to more rows than it has
# logical lines). See `src/tui/mod.rs::render_info`.
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop"] }
# Glyph rasteriser for the live-text overlay style (`src/overlay/text.rs`). Pure
# Rust; it turns the bundled Inter font into anti-aliased glyph coverage but
# does no shaping or line breaking - the overlay does its own single-line
# wrapping against the fixed caption width.
ab_glyph = "0.2"

[features]
# Accelerator backends for the single transcribe.cpp inference module
# (src/inference.rs). None is enabled by default, so a plain `cargo build`
# links transcribe.cpp with no accelerator - CPU only. InferenceEngine always
# tries accelerators in a fixed priority order (cuda, rocm, vulkan, metal)
# before falling back to the explicit, always-available CPU backend; a
# backend whose feature isn't compiled in simply isn't satisfiable natively
# and InferenceEngine moves on to the next candidate, so this priority list
# needs no `cfg` gating of its own. Enabling a feature only controls whether
# transcribe-cpp-sys's CMake build compiles and links that backend.
gpu-vulkan = ["transcribe-cpp/vulkan"]
gpu-cuda = ["transcribe-cpp/cuda"]
gpu-rocm = ["transcribe-cpp/rocm"]
gpu-metal = ["transcribe-cpp/metal"]

# build.rs reuses the real CLI definition (src/cli.rs) to render the man pages
# and shell completions that ship in the packages, so they can never drift
# from `--help`. These only build in the build script, never into the binary.
[build-dependencies]
clap = { version = "4", features = ["derive"] }
clap_mangen = "0.2"
clap_complete = "4"

[dev-dependencies]
portable-pty = "0.9"
vt100 = "0.15"
