[package]
name = "tonguetyped"
version = "0.2.2"
edition = "2021"
description = "Local Linux dictation controlled from the terminal or a desktop-wide keyboard shortcut"
repository = "https://github.com/cheerfulScumbag/tonguetyped"
license = "MIT"

[package.metadata.deb]
maintainer = "cheerfulScumbag <164391367+cheerfulScumbag@users.noreply.github.com>"
extended-description = """\
Privacy-focused offline dictation for Linux. Speech is transcribed on this
machine with transcribe.cpp and typed into the focused application or written
to text files. No account, no cloud, and no audio leaves the computer."""
depends = "$auto"
# wtype types through the Wayland virtual-keyboard protocol (wlroots
# compositors only) and wl-clipboard provides `wl-copy`, which the clipboard
# and paste output methods and the typing fallback copy with.
# Recommends rather than Depends because the deb targets releases as old as
# Debian bullseye, which has no wtype package. dotool - the helper that works
# on KDE's KWin - is deliberately not listed here: Debian has no dotool
# package (only the unrelated ydotool), so recommending it could never
# resolve. The Arch and Nix packages do ship dotool.
recommends = "wtype, wl-clipboard"
# xclip is the clipboard helper on X11 sessions, for the clipboard and paste
# output methods and the typing fallback.
suggests = "xclip"
section = "utils"
priority = "optional"

# One .deb per GPU backend (each also carries the CPU fallback). They all
# install /usr/bin/tonguetyped, so each provides, conflicts with and replaces
# the virtual `tonguetyped` package (the pre-0.2.2 bundled package's name):
# installing one backend swaps out whichever was there before.
[package.metadata.deb.variants.gpu-vulkan]
name = "tonguetyped-gpu-vulkan"
provides = "tonguetyped"
conflicts = "tonguetyped"
replaces = "tonguetyped"

[package.metadata.deb.variants.gpu-cuda]
name = "tonguetyped-gpu-cuda"
provides = "tonguetyped"
conflicts = "tonguetyped"
replaces = "tonguetyped"

[package.metadata.deb.variants.gpu-rocm]
name = "tonguetyped-gpu-rocm"
provides = "tonguetyped"
conflicts = "tonguetyped"
replaces = "tonguetyped"

[[bin]]
name = "tonguetyped"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
sha2 = "0.10"
cpal = "0.18.2"
alsa = "0.11"
rubato = "0.15"
transcribe-cpp = { version = "=0.2.4", default-features = false }
vad-rs = { git = "https://github.com/cjpais/vad-rs", rev = "2a412ed858695b9251f3f5a1a20d95b59fa7c498" }
rusqlite = { version = "0.32", features = ["bundled"] }
indicatif = "0.17"
num_cpus = "1"
# Reads WAV input for `tonguetyped transcribe <file>` (src/transcribe.rs); the
# live capture path uses cpal/rubato and never touches WAV files.
hound = "3"
reqwest = { version = "0.12", features = ["stream"] }
directories = "5"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
libc = "0.2"
enigo = "0.3"
ashpd = { version = "0.12", default-features = false, features = ["tokio"] }
# Session-bus client for pausing MPRIS media players while recording
# (`src/media.rs`). Same major version and tokio executor ashpd already pulls in.
zbus = { version = "5", default-features = false, features = ["tokio"] }
# `unstable-rendered-line-info` exposes `Paragraph::line_count`, which the
# dashboard's Info/result pane needs to clamp its scroll offset to the wrapped
# content height (a long single-line transcript wraps to more rows than it has
# logical lines). See `src/tui/mod.rs::render_info`.
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop"] }

[features]
# Accelerator backends for the single transcribe.cpp inference module
# (src/inference.rs). None is enabled by default, so a plain `cargo build`
# links transcribe.cpp with no accelerator - CPU only. InferenceEngine always
# tries accelerators in a fixed priority order (cuda, rocm, vulkan, metal)
# before falling back to the explicit, always-available CPU backend; a
# backend whose feature isn't compiled in simply isn't satisfiable natively
# and InferenceEngine moves on to the next candidate, so this priority list
# needs no `cfg` gating of its own. Enabling a feature only controls whether
# transcribe-cpp-sys's CMake build compiles and links that backend.
gpu-vulkan = ["transcribe-cpp/vulkan"]
gpu-cuda = ["transcribe-cpp/cuda"]
gpu-rocm = ["transcribe-cpp/rocm"]
gpu-metal = ["transcribe-cpp/metal"]

[dev-dependencies]
portable-pty = "0.9"
vt100 = "0.15"
